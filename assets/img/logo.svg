<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 264" role="img" aria-labelledby="crestTitle crestDesc">
  <title id="crestTitle">CG足球俱乐部队徽</title>
  <desc id="crestDesc">绿金配色的盾形队徽：顶部王冠，中间为 CG 字样，下方为足球。</desc>
  <defs>
    <linearGradient id="cgShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12513c"/>
      <stop offset=".55" stop-color="#0a2e22"/>
      <stop offset="1" stop-color="#04140f"/>
    </linearGradient>
    <linearGradient id="cgGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeeb4"/>
      <stop offset=".3" stop-color="#e7c968"/>
      <stop offset=".62" stop-color="#c2952c"/>
      <stop offset="1" stop-color="#f7e3a0"/>
    </linearGradient>
    <radialGradient id="cgGlow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#38a97a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0a2e22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 盾牌主体 -->
  <path d="M110 12 204 44v82c0 66-40 108-94 126C56 234 16 192 16 126V44Z"
        fill="url(#cgShield)" stroke="url(#cgGold)" stroke-width="7" stroke-linejoin="round"/>
  <!-- 内描边 -->
  <path d="M110 30 188 56v70c0 56-34 92-78 108C66 218 32 182 32 126V56Z"
        fill="none" stroke="url(#cgGold)" stroke-width="2" stroke-opacity=".55"/>
  <ellipse cx="110" cy="150" rx="86" ry="96" fill="url(#cgGlow)"/>

  <!-- 王冠 -->
  <g fill="url(#cgGold)">
    <rect x="75" y="80" width="70" height="13" rx="4"/>
    <path d="M77 80 86 60l10 20Z"/>
    <path d="M100 80 110 54l10 26Z"/>
    <path d="M124 80 133 60l10 20Z"/>
    <circle cx="86" cy="57" r="4"/>
    <circle cx="110" cy="51" r="4.6"/>
    <circle cx="134" cy="57" r="4"/>
  </g>

  <!-- EST.2016 绶带 -->
  <rect x="30" y="100" width="160" height="21" rx="6" fill="url(#cgGold)"/>
  <text x="110" y="115.5" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="12.5" letter-spacing="2.2" fill="#0a2e22">EST. 2016</text>

  <!-- CG 主字 -->
  <text x="110" y="196" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="88" font-weight="900" letter-spacing="1" fill="url(#cgGold)"
        stroke="#6b4d10" stroke-width="1.1" paint-order="stroke">CG</text>

  <!-- 足球 -->
  <circle cx="110" cy="222" r="16" fill="#04140f" stroke="url(#cgGold)" stroke-width="3"/>
  <path d="M110 214.5 117 219.4 114.3 227.6 105.7 227.6 103 219.4Z" fill="url(#cgGold)"/>
  <g stroke="url(#cgGold)" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".85">
    <path d="M110 214.5V207"/>
    <path d="M103 219.4 96.6 216"/>
    <path d="M117 219.4 123.4 216"/>
    <path d="M105.7 227.6 101.6 233.4"/>
    <path d="M114.3 227.6 118.4 233.4"/>
  </g>
</svg>
