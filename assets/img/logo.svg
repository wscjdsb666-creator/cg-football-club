<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 264" role="img" aria-labelledby="crestTitle crestDesc">
  <title id="crestTitle">CG足球俱乐部队徽</title>
  <desc id="crestDesc">红蓝配色的盾形队徽：顶部王冠，中间为 CG 字样，下方为足球，绶带写着 EST. 2018。</desc>
  <defs>
    <linearGradient id="cgNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4a91"/>
      <stop offset=".55" stop-color="#102c60"/>
      <stop offset="1" stop-color="#08183a"/>
    </linearGradient>
    <linearGradient id="cgRed" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a8101f"/>
      <stop offset=".5" stop-color="#d7192d"/>
      <stop offset="1" stop-color="#ff4d5e"/>
    </linearGradient>
    <clipPath id="cgShieldClip">
      <path d="M110 12 204 44v82c0 66-40 108-94 126C56 234 16 192 16 126V44Z"/>
    </clipPath>
  </defs>

  <!-- 盾牌：左下深蓝 + 右上红色斜切 -->
  <g clip-path="url(#cgShieldClip)">
    <rect x="0" y="0" width="220" height="264" fill="url(#cgNavy)"/>
    <path d="M-10 264 210 74 220 96 220 264Z" fill="url(#cgRed)"/>
    <path d="M-10 264 210 74" stroke="#ffffff" stroke-width="4" stroke-opacity=".85" fill="none"/>
    <ellipse cx="110" cy="150" rx="92" ry="104" fill="#ffffff" opacity=".06"/>
  </g>

  <!-- 外框与内描边 -->
  <path d="M110 12 204 44v82c0 66-40 108-94 126C56 234 16 192 16 126V44Z"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
  <path d="M110 30 188 56v70c0 56-34 92-78 108C66 218 32 182 32 126V56Z"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity=".45"/>

  <!-- 王冠 -->
  <g fill="#ffffff">
    <rect x="75" y="80" width="70" height="13" rx="4"/>
    <path d="M77 80 86 60l10 20Z"/>
    <path d="M100 80 110 54l10 26Z"/>
    <path d="M124 80 133 60l10 20Z"/>
    <circle cx="86" cy="57" r="4"/>
    <circle cx="110" cy="51" r="4.6"/>
    <circle cx="134" cy="57" r="4"/>
  </g>

  <!-- 绶带 -->
  <rect x="30" y="100" width="160" height="21" rx="6" fill="#ffffff"/>
  <text x="110" y="115.5" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="12.5" letter-spacing="2.2" fill="#0c1f47">EST. 2018</text>

  <!-- CG 主字 -->
  <text x="110" y="196" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="88" font-weight="900" letter-spacing="1" fill="#ffffff"
        stroke="#0a1a3d" stroke-width="4" paint-order="stroke" stroke-linejoin="round">CG</text>
  <text x="110" y="196" text-anchor="middle" font-family="Arial Black, Impact, sans-serif"
        font-size="88" font-weight="900" letter-spacing="1" fill="#ffffff" opacity=".92">CG</text>

  <!-- 足球 -->
  <circle cx="110" cy="222" r="16" fill="#0a1a3d" stroke="#ffffff" stroke-width="3"/>
  <path d="M110 214.5 117 219.4 114.3 227.6 105.7 227.6 103 219.4Z" fill="#ffffff"/>
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".85">
    <path d="M110 214.5V207"/>
    <path d="M103 219.4 96.6 216"/>
    <path d="M117 219.4 123.4 216"/>
    <path d="M105.7 227.6 101.6 233.4"/>
    <path d="M114.3 227.6 118.4 233.4"/>
  </g>
</svg>
